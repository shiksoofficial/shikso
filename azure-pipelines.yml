trigger:
  branches:
    include:
      - master

pool:
  name: frontend-agent

stages:
  # -----------------------------------
  # DEV DEPLOY
  # -----------------------------------
  - stage: Dev
    displayName: "Deploy to Development"
    jobs:
      - job: DeployDev
        displayName: "Deploy to Vercel - Dev"
        variables:
          VERCEL_PROJECT_ID: "prj_voN6H0tuzIvCrCvbgfE4Rf5xLgxr"
          VERCEL_ORG_ID: "OxLeE5fU9CijZi3EU6BizxAp"
          VERCEL_TOKEN: "vcp_2mp8WcRbFSTr51WRCDyVfv6UUJkVge6379Irz6lwIoEw9cyPyr0qA19k"

        steps:
          # Install Vercel CLI
          - script: |
              npm install -g vercel@latest
            displayName: "Install Vercel CLI"

          # Clean .vercel folder if exists
          - script: |
              if exist .vercel rmdir /s /q .vercel
            displayName: "Remove existing .vercel folder"

          # Link Project
          - script: |
              vercel link --yes
            displayName: "Link Vercel Project"
            env:
              VERCEL_TOKEN: $(VERCEL_TOKEN)
              VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)
              VERCEL_ORG_ID: $(VERCEL_ORG_ID)

          # Pull environment variables
          - script: |
              vercel env pull .env.production --yes
            displayName: "Pull Vercel environment variables"
            env:
              VERCEL_TOKEN: $(VERCEL_TOKEN)

          # Deploy
          - script: |
              vercel deploy --prod --yes
            displayName: "Deploy to Vercel (production)"
            env:
              VERCEL_TOKEN: $(VERCEL_TOKEN)

  # -----------------------------------
  # PROD DEPLOY
  # -----------------------------------
  - stage: Prod
    displayName: "Deploy to Production"
    dependsOn: Dev
    condition: succeeded()
    jobs:
      - deployment: DeployProd
        environment: Production
        displayName: "Deploy to Vercel - Prod"
        variables:
          VERCEL_PROJECT_ID: "prj_MuXcIUzpCV9bDkNJDu2QIxWP9O3d"
          VERCEL_ORG_ID: "gPLVlvJxaFI0eeU4D9A2btu2"
          VERCEL_TOKEN: "vcp_7rgSZd2Big5XzmFk4ElhPq9cfPE1WTC11nhUxlFBDaH6lxHFdB3Jmd9e"

        strategy:
          runOnce:
            deploy:
              steps:
                # Install CLI
                - script: |
                    npm install -g vercel@latest
                  displayName: "Install Vercel CLI"

                # Clean old .vercel link
                - script: |
                    if exist .vercel rmdir /s /q .vercel
                  displayName: "Remove existing .vercel"

                # Link to the production project
                - script: |
                    vercel link --yes
                  displayName: "Link Vercel Project"
                  env:
                    VERCEL_TOKEN: $(VERCEL_TOKEN)
                    VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)
                    VERCEL_ORG_ID: $(VERCEL_ORG_ID)

                # Pull env
                - script: |
                    vercel env pull .env.production --yes
                  displayName: "Pull Vercel environment variables"
                  env:
                    VERCEL_TOKEN: $(VERCEL_TOKEN)

                # Deploy to production
                - script: |
                    vercel deploy --prod --yes
                  displayName: "Deploy to Vercel (production)"
                  env:
                    VERCEL_TOKEN: $(VERCEL_TOKEN)
